# A complete local stack: the dashboard plus an S3 bucket to point it at.
#
#   docker compose up --build
#   → dashboard  http://localhost:3000
#   → storage    http://localhost:7070  (S3 API, keys below)
#
# Drop `<roomId>/<callId>/…` objects into the `observertc` bucket and they show
# up in the dashboard. Any S3 client will do, or copy the files in: with this
# storage a bucket is a directory and an object is a file,
#
#   docker compose cp ./my-room storage:/data/observertc/
#
# This is a development convenience, not a production topology — the keys below
# are written in this file and the dashboard runs without sign-in. Both are fine
# only because every port here is published on 127.0.0.1, so nothing is
# reachable from another machine. For an installation others can reach, see
# "Who may open it" in the README.

services:
  # Versity S3 Gateway over a plain directory. MinIO, which stood here before,
  # no longer publishes container images.
  storage:
    image: versity/versitygw:v1.11.0
    # The bucket is a directory under the gateway's root; made here so that the
    # dashboard has something to list on the first start.
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /data/observertc && exec /usr/local/bin/versitygw --health /health --cors-allow-origin http://localhost:3000 posix /data
    environment:
      ROOT_ACCESS_KEY_ID: localdev
      ROOT_SECRET_ACCESS_KEY: localdev-secret
    ports:
      - '127.0.0.1:7070:7070'
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:7070/health']
      interval: 5s
      timeout: 3s
      retries: 20

  dashboard:
    build:
      context: .
      # Empty means the browser calls /api on the same origin, which is what
      # this compose file serves.
      args:
        NEXT_PUBLIC_API_BASE_URL: ''
    depends_on:
      storage:
        condition: service_healthy
    environment:
      # No sign-in, for this machine only (see the note at the top). Without
      # this line the dashboard answers 503 until the sign-in is configured.
      AUTH_DISABLED: 'true'
      # The server reaches storage by service name on the compose network...
      S3_ENDPOINT: http://storage:7070
      # ...but a presigned URL is followed by the *browser*, which resolves
      # `storage` to nothing. A signature is bound to the host it was made for, so
      # browser-facing URLs are signed against the published address instead.
      S3_PUBLIC_ENDPOINT: http://localhost:7070
      S3_BUCKET: observertc
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: localdev
      S3_SECRET_ACCESS_KEY: localdev-secret
      S3_FORCE_PATH_STYLE: 'true'
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  storage-data:
